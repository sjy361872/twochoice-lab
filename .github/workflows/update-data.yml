name: "'둘 중 하나' 목록 갱신"
# 30분마다 클로브 목록(요청 약 6번)을 읽고, 결과 JSON 만 data 브랜치에 올린다.
# 사이트는 VITE_DATA_URL(= raw.githubusercontent.com/<owner>/<repo>/data/nibuichi.json)에서 바로 읽으므로
# 코드 브랜치에 데이터 커밋이 쌓이지 않고 사이트 재배포도 일어나지 않는다.
on:
  schedule:
    - cron: '7,37 * * * *'   # 매시 7분·37분 (정각은 GitHub 이 붐벼서 늦어짐)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: update-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - name: 이전 결과 불러오기 (이미 읽은 가챠는 OCR 생략)
        run: |
          git fetch origin data --depth=1 || true
          git show origin/data:nibuichi.json > /tmp/prev.json 2>/dev/null && mv /tmp/prev.json public/data/nibuichi.json || true
      - run: python scripts/fetch_nibuichi.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 없으면 무료 OCR 로만 읽는다
      - name: data 브랜치에 올리기 (바뀐 경우만)
        run: |
          cp public/data/nibuichi.json /tmp/nibuichi.json
          git config user.name "twochoice-bot"
          git config user.email "actions@users.noreply.github.com"
          if git rev-parse --verify -q origin/data >/dev/null; then git checkout -B data origin/data; else git checkout --orphan data && git rm -rfq .; fi
          cp /tmp/nibuichi.json nibuichi.json
          git add nibuichi.json
          git diff --cached --quiet || (git commit -qm "data: $(date -u +%FT%TZ)" && git push -q origin data)
